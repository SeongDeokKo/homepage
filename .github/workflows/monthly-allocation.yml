name: Monthly asset allocation signals
on:
  schedule:
    - cron: '25 1 8 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: monthly-allocation
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r scripts/requirements-allocation.txt
      - name: Calculate signals
        run: python scripts/update_allocation.py
      - name: Commit only when changed
        run: |
          if ! git diff --quiet -- data/allocations.json || [ -n "$(git ls-files --others --exclude-standard data/allocations.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/allocations.json
            git commit -m "Update monthly allocation signals"
            git push
          fi
